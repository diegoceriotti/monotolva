<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#14161a;
  --panel:#1e2126;
  --panel-2:#262a30;
  --border:#383d44;
  --text:#f0f1ee;
  --muted:#8d95a0;
  --yellow:#FFB300;
  --yellow-dark:#CC8F00;
  --green:#3E8E5A;
  --green-dark:#2C6B41;
  --blue:#2E6DA4;
  --blue-dark:#1F4E79;
  --purple:#6C4FA1;
  --red:#D9463B;
  --red-bg:#3A1E1C;
  --orange:#D97706;
}
body{font-family:system-ui,-apple-system,sans-serif;font-size:15px;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:1rem}
h1{font-size:19px;font-weight:800;margin-bottom:0.25rem;display:flex;align-items:center;gap:8px;letter-spacing:0.4px;text-transform:uppercase}
.subt{font-size:12px;color:var(--muted);margin-bottom:1rem}
.card{background:var(--panel);border:1.5px solid var(--border);border-radius:10px;padding:1.25rem;margin-bottom:1rem}
.card-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;text-transform:uppercase;letter-spacing:0.6px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--panel-2);border-radius:8px;padding:0.9rem;text-align:center}
.metric-label{font-size:11px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.4px}
.metric-val{font-size:22px;font-weight:800;line-height:1.1}
.metric-unit{font-size:11px;color:var(--muted);margin-top:2px}
.barra-wrap{background:var(--panel-2);border-radius:8px;overflow:hidden;height:18px;margin:8px 0;border:1px solid var(--border)}
.barra-fill{height:100%;border-radius:8px;transition:width 0.4s;background:var(--green)}
.barra-fill.warn{background:var(--yellow)}
.barra-fill.danger{background:var(--red)}
.sep{border:none;border-top:1px solid var(--border);margin:12px 0}
.hist-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px}
.hist-row:last-child{border-bottom:none}
.pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px}
.pill.verde{background:rgba(62,142,90,0.2);color:#7FCB9B}
.pill.azul{background:rgba(46,109,164,0.2);color:#7FB0E0}
.pill.gris{background:rgba(141,149,160,0.2);color:var(--muted)}
.nav-tabs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
.nav-tab{padding:10px 6px;border-radius:8px;border:1.5px solid var(--border);background:var(--panel);color:var(--muted);font-size:12px;font-weight:800;text-align:center;cursor:pointer;text-transform:uppercase;letter-spacing:0.3px}
.nav-tab.activo{background:var(--yellow);color:#1a1300;border-color:var(--yellow)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
.live-dot.on{background:var(--green);animation:pulso 1.2s infinite alternate}
@keyframes pulso{to{opacity:0.35}}
.vacio{font-size:13px;color:var(--muted);text-align:center;padding:1.5rem 0}
@media(max-width:400px){.grid3,.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1><i class="ti ti-tractor"></i> Monotolva</h1>
  <div class="subt"><span class="live-dot" id="conn-dot"></span><span id="conn-txt">conectando...</span></div>

  <!-- ESTADO EN VIVO -->
  <div class="card" id="card-vivo">
    <div class="card-title"><i class="ti ti-broadcast"></i> Estado en vivo</div>
    <div id="vivo-contenido"><div class="vacio">Cargando...</div></div>
  </div>

  <!-- HISTORIAL -->
  <div class="nav-tabs">
    <button class="nav-tab activo" id="tab-camiones" onclick="cambiarTab('camiones')"><i class="ti ti-truck"></i> Camiones</button>
    <button class="nav-tab" id="tab-silobolsas" onclick="cambiarTab('silobolsas')"><i class="ti ti-package"></i> Silobolsas</button>
    <button class="nav-tab" id="tab-ensayos" onclick="cambiarTab('ensayos')"><i class="ti ti-flask"></i> Ensayos</button>
  </div>

  <div class="card" id="panel-camiones">
    <div class="card-title"><i class="ti ti-history"></i> Historial de camiones</div>
    <div id="lista-camiones"><div class="vacio">Sin datos todavía...</div></div>
  </div>

  <div class="card" id="panel-silobolsas" style="display:none">
    <div class="card-title"><i class="ti ti-history"></i> Historial de silobolsas</div>
    <div id="lista-silobolsas"><div class="vacio">Sin datos todavía...</div></div>
  </div>

  <div class="card" id="panel-ensayos" style="display:none">
    <div class="card-title"><i class="ti ti-history"></i> Historial de ensayos</div>
    <div id="lista-ensayos"><div class="vacio">Sin datos todavía...</div></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
  apiKey:"AIzaSyCPAW-Lx6qu3-NII4FwcuC27wDD56cmjOY",
  authDomain:"monotolva-campo.firebaseapp.com",
  databaseURL:"https://monotolva-campo-default-rtdb.firebaseio.com",
  projectId:"monotolva-campo",
  storageBucket:"monotolva-campo.firebasestorage.app",
  messagingSenderId:"169072085835",
  appId:"1:169072085835:web:95b5ee155081ed3cb636ce"
};
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

function fmt(n){return Number(n||0).toLocaleString('es-AR')}

// ── Indicador de conexión ───────────────────────────────
db.ref('.info/connected').on('value', snap=>{
  const dot=document.getElementById('conn-dot');
  const txt=document.getElementById('conn-txt');
  if(snap.val()===true){
    dot.className='live-dot on';
    txt.textContent='en línea — se actualiza solo';
  }else{
    dot.className='live-dot';
    txt.textContent='sin conexión — mostrando lo último que se vio';
  }
});

// ── ESTADO EN VIVO ───────────────────────────────────────
db.ref('vivo').on('value', snap=>{
  const data=snap.val();
  const cont=document.getElementById('vivo-contenido');
  if(!data || !data.tipo){
    cont.innerHTML='<div class="vacio"><i class="ti ti-moon" style="font-size:22px;display:block;margin-bottom:6px"></i>Sin actividad ahora mismo</div>';
    return;
  }
  if(data.tipo==='camion'){
    const e=data.datos;
    const cargado=e.cargado||0, cupo=e.cupo||1;
    const falta=Math.max(0, cupo-cargado);
    const pct=Math.min(100,Math.round(cargado/cupo*100));
    const barraClase=pct>=95?'danger':pct>=75?'warn':'';
    cont.innerHTML=`
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px">
        <div>
          <div style="font-weight:800;font-size:16px">${e.patente||'—'}</div>
          <div style="font-size:12px;color:var(--muted)">${e.chofer||'—'}${e.nombreDe?' · A nombre de '+e.nombreDe:''}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:12px;color:var(--muted)">Carta N° ${e.carta||'—'}</div>
          <div style="font-size:12px;color:var(--muted)">${e.producto||'—'} → ${e.destino||'—'}</div>
        </div>
      </div>
      <div class="grid3">
        <div class="metric"><div class="metric-label">Cupo</div><div class="metric-val">${fmt(cupo)}</div><div class="metric-unit">kg</div></div>
        <div class="metric"><div class="metric-label">Cargado</div><div class="metric-val" style="color:var(--green)">${fmt(Math.round(cargado))}</div><div class="metric-unit">kg</div></div>
        <div class="metric"><div class="metric-label">Falta</div><div class="metric-val" style="color:var(--yellow)">${fmt(Math.round(falta))}</div><div class="metric-unit">kg</div></div>
      </div>
      <div style="margin-top:12px">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:4px"><span>Progreso</span><span>${pct}%</span></div>
        <div class="barra-wrap"><div class="barra-fill ${barraClase}" style="width:${pct}%"></div></div>
      </div>`;
  }else if(data.tipo==='silobolsa'){
    const e=data.datos;
    cont.innerHTML=`
      <div style="margin-bottom:10px">
        <div style="font-weight:800;font-size:16px">Silobolsa ${e.numero||'—'}</div>
        <div style="font-size:12px;color:var(--muted)">${e.producto||'—'} · Lote inicial: ${e.lote||'—'}</div>
      </div>
      <div class="metric">
        <div class="metric-label">Total acumulado</div>
        <div class="metric-val" style="color:var(--purple);font-size:28px">${fmt(Math.round(e.total||0))}</div>
        <div class="metric-unit">kg</div>
      </div>`;
  }
});

// ── HISTORIAL ─────────────────────────────────────────
db.ref('historial').on('value', snap=>{
  const data=snap.val()||{};
  renderCamiones(data.camiones||[]);
  renderSilobolsas(data.silobolsas||[]);
  renderEnsayos(data.ensayos||[]);
});

function renderCamiones(lista){
  const cont=document.getElementById('lista-camiones');
  if(!lista.length){cont.innerHTML='<div class="vacio">Sin datos todavía...</div>';return;}
  cont.innerHTML=lista.slice().reverse().map(c=>{
    const diff=(c.cargado||0)-(c.cupo||0);
    const ok=Math.abs(diff)<200;
    return `<div class="hist-row" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;justify-content:space-between">
        <strong>${c.patente||'—'}</strong>
        <span class="pill ${ok?'verde':'azul'}">${diff>=0?'+':''}${fmt(Math.round(diff))} kg</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">${c.producto||'—'} · ${c.fecha||'—'} · ${fmt(Math.round(c.cargado||0))} / ${fmt(c.cupo||0)} kg · Carta ${c.carta||'—'}${c.nombreDe?' · '+c.nombreDe:''}</div>
    </div>`;
  }).join('');
}

function renderSilobolsas(lista){
  const cont=document.getElementById('lista-silobolsas');
  if(!lista.length){cont.innerHTML='<div class="vacio">Sin datos todavía...</div>';return;}
  cont.innerHTML=lista.slice().reverse().map(s=>`
    <div class="hist-row" style="flex-direction:column;align-items:stretch;gap:4px">
      <div style="display:flex;justify-content:space-between">
        <strong>Silobolsa ${s.numero||'—'}</strong>
        <span class="pill gris">${fmt(Math.round(s.total||0))} kg</span>
      </div>
      <div style="font-size:12px;color:var(--muted)">${s.producto||'—'} · Lote inicial: ${s.lote||'—'}</div>
    </div>`).join('');
}

function renderEnsayos(lista){
  const cont=document.getElementById('lista-ensayos');
  if(!lista.length){cont.innerHTML='<div class="vacio">Sin datos todavía...</div>';return;}
  cont.innerHTML=lista.slice().reverse().map(e=>`
    <div class="hist-row">
      <span style="color:var(--muted)">#${e.num} · ${e.fecha||''} ${e.hora||''} — ${e.desc||'—'}</span>
      <span style="font-weight:800">${fmt(Math.round(e.peso||0))} kg</span>
    </div>`).join('');
}

// ── TABS ──────────────────────────────────────────────
function cambiarTab(tab){
  ['camiones','silobolsas','ensayos'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('activo', t===tab);
    document.getElementById('panel-'+t).style.display = t===tab ? 'block' : 'none';
  });
}
</script>
</body>
</html>
